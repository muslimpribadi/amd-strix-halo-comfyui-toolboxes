name: Build and Publish

on:
  schedule:
    - cron: '30 0 * * *'
      timezone: 'Asia/Jakarta'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      
    steps:
      - name: Get upstream ComfyUI version and format tag
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Comfy-Org/ComfyUI/releases/latest | jq -r .tag_name)
          
          # Concatenate the prefix and the upstream version
          FORMATTED_TAG="comfyui-$LATEST-rocm7.14"
          
          echo "tag=$FORMATTED_TAG" >> $GITHUB_OUTPUT

      - name: Check if tag exists in GHCR
        id: check_ghcr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE_NAME=$(basename ${{ github.repository }})
          TARGET_TAG="${{ steps.upstream.outputs.tag }}"
          
          # Query GHCR; redirect stderr to /dev/null so 404s don't pollute logs, default to empty array
          VERSIONS_JSON=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/users/${{ github.repository_owner }}/packages/container/${PACKAGE_NAME}/versions" 2>/dev/null || echo "[]")

          # Filter JSON for matching tag ID
          TAG_EXISTS=$(echo "$VERSIONS_JSON" | jq -r ".[] | select(.metadata.container.tags[]? == \"$TARGET_TAG\") | .id")

          if [ -n "$TAG_EXISTS" ] && [ "$TAG_EXISTS" != "null" ]; then
            echo "Tag $TARGET_TAG already exists in GHCR. Stopping."
            echo "build_needed=false" >> $GITHUB_OUTPUT
          else
            echo "New version detected or package missing ($TARGET_TAG). Proceeding with build."
            echo "build_needed=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.check_ghcr.outputs.build_needed == 'true'
        uses: actions/checkout@v5

      - name: Log in to GHCR
        if: steps.check_ghcr.outputs.build_needed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata and Dual-Tag
        if: steps.check_ghcr.outputs.build_needed == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.upstream.outputs.tag }}

      - name: Build and push Docker image
        if: steps.check_ghcr.outputs.build_needed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.rocm7.14
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Update README Badge
        if: steps.check_ghcr.outputs.build_needed == 'true'
        run: |
          # Retrieve layer size sum from image manifest in GHCR
          SIZE_BYTES=$(docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest | jq '[.layers[].size] | add')
          SIZE_GB=$(echo "$SIZE_BYTES" | awk '{print int(($1 / 1024 / 1024 / 1024) + 0.5)"GB"}')

          echo "Calculated GHCR image size: $SIZE_GB"

          # Replace the github-ghcr-size-shield reference link in README.md
          sed -i "s|\[github-ghcr-size-shield\]: .*|\[github-ghcr-size-shield\]: https://img.shields.io/badge/GHCR%20Size-${SIZE_GB}-blue|g" README.md

          # Commit updated README.md back to repository
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md

          if ! git diff --staged --quiet; then
            git commit -m "docs: update GHCR image size badge to ${SIZE_GB}"
            git push
          else
            echo "No badge changes needed in README.md"
          fi
